site:
  name: KU Soluciones
  site: 'https://www.ku-soluciones.cl'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: orcPxI47GSa-cRvY11tUe6iGg2IO_RPvnA1q95iEM3M

# Default SEO metadata
metadata:
  title:
    default: KU Soluciones - Software a medida para pymes en Chile
    template: '%s | KU Soluciones - Desarrolladores Tecnológicos Chile'
  description: "🚀 Especialistas en automatización de procesos en Chile y soluciones digitales personalizadas para empresas que quieren crecer con tecnología. Software a medida para pymes chilenas con soporte local."
  keywords: 
    - software a medida para pymes
    - automatización de procesos en Chile
    - soluciones digitales personalizadas
    - desarrolladores tecnológicos en Chile
    - aplicaciones web Chile
    - sistemas de gestión empresarial
    - desarrollo software Chile
    - pymes Chile tecnología
    - APIs personalizadas Chile
    - soporte técnico Chile
  author: KU Soluciones
  publisher: KU Soluciones
  robots:
    index: true
    follow: true
  openGraph:
    site_name: KU Soluciones
    locale: es_CL
    images:
      - url: 'https://res.cloudinary.com/dddfx1xwt/image/upload/v1750340412/logoku_wg4bgn.webp'
        width: 1200
        height: 628
        alt: KU Soluciones - Software a medida para pymes en Chile
    type: website
  twitter:
    handle: '@kusoluciones'
    site: '@kusoluciones'
    cardType: summary_large_image
    creator: '@kusoluciones'

i18n:
  language: es
  textDirection: ltr
  locale: es-CL

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/blog/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'categoria' # Category main path /categoria/some-category, you can change this to "topics" (/topics/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'etiqueta' # Tag main path /etiqueta/some-tag, you can change this to "topics" (/topics/some-tag)
      robots:
        index: true

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
